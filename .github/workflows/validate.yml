name: Validate skill helpers
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  helpers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q skills/frida-modified/scripts
      - run: python -m unittest discover -s tests -v
