name: Validate skill helpers
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  helpers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q skills/frida-modified/scripts
      - run: python -m unittest discover -s tests -v
  installation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned skills CLI
        run: npm install --prefix .cache/install-cli --no-save --ignore-scripts --package-lock=false skills@1.5.26
      - name: Verify project installation for six agents
        run: python scripts/check_installation.py --cli .cache/install-cli/node_modules/skills/bin/cli.mjs --record .cache/install-project.json
      - name: Verify global installation in the clean CI account
        run: python scripts/check_installation.py --cli .cache/install-cli/node_modules/skills/bin/cli.mjs --scope global --record .cache/install-global.json
      - uses: actions/upload-artifact@v4
        with:
          name: installation-${{ matrix.os }}
          path: .cache/install-*.json
          include-hidden-files: true
  native-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned agent CLIs
        run: npm install --global @openai/codex@0.154.0 @anthropic-ai/claude-code@2.1.273
      - name: Validate Claude manifests
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
      - name: Verify native install and uninstall without model calls
        run: python scripts/check_native_installation.py --record .cache/native-install.json --log .cache/native-install-log.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-plugins
          path: .cache/native-install*.json
          include-hidden-files: true
